name: Deploy Cipher

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to /var/www/cipher.faku.pro/
        run: |
          rsync -a --delete dist/ /var/www/cipher.faku.pro/
